<?xml version="1.0" encoding="UTF-8"?>
<!-- Cervical Spinal Cord Cross Section
     Key differences: Larger cord, both gracilis + cuneatus present,
     large lateral CST (arms + legs), prominent anterior horns (arm LMNs)
     Sources: First Aid 2024, Netter's Atlas -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="50 10 200 200" width="400" height="400">
  <defs>
    <radialGradient id="cg" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#f5f0e8"/><stop offset="100%" stop-color="#e0d8cc"/>
    </radialGradient>
  </defs>
  <text x="150" y="22" text-anchor="middle" font-size="8" font-weight="700" fill="#666">CERVICAL (C5-C8)</text>
  <!-- Larger oval for cervical enlargement -->
  <ellipse cx="150" cy="115" rx="60" ry="75" fill="url(#cg)" stroke="#b0a89c" stroke-width="1.5"/>
  <!-- Gray matter - prominent anterior horns for upper limb LMNs -->
  <path d="M 150 65 Q 138 78 125 90 Q 112 102 118 118 Q 124 135 112 152 Q 106 164 114 170 Q 132 182 150 182 Q 168 182 186 170 Q 194 164 188 152 Q 176 135 182 118 Q 188 102 175 90 Q 162 78 150 65 Z" fill="#c4beb4" stroke="#a09888" stroke-width="0.8"/>
  <circle cx="150" cy="115" r="3" fill="#8aaab4"/>
  <!-- Tracts -->
  <path d="M 140 60 Q 150 50 160 60 L 164 98 Q 150 102 136 98 Z" fill="#5B8A9A" opacity="0.8"/>
  <text x="150" y="48" text-anchor="middle" font-size="6" fill="#5B8A9A" font-weight="700">DCML</text>
  <text x="130" y="78" font-size="5" fill="#5B8A9A">Cu</text>
  <text x="150" y="72" text-anchor="middle" font-size="5" fill="#4A7A8A">Gr</text>
  <text x="168" y="78" font-size="5" fill="#5B8A9A">Cu</text>
  
  <path d="M 120 100 Q 110 118 116 140 Q 126 148 130 130 Q 126 114 122 100 Z" fill="#7B68AE" opacity="0.8"/>
  <path d="M 180 100 Q 190 118 184 140 Q 174 148 170 130 Q 174 114 178 100 Z" fill="#7B68AE" opacity="0.8"/>
  <text x="102" y="110" font-size="6" fill="#7B68AE" font-weight="700">CST</text>
  
  <path d="M 104 120 Q 98 138 104 155 Q 114 165 120 148 Q 114 132 108 120 Z" fill="#C97070" opacity="0.8"/>
  <path d="M 196 120 Q 202 138 196 155 Q 186 165 180 148 Q 186 132 192 120 Z" fill="#C97070" opacity="0.8"/>
  <text x="88" y="140" font-size="6" fill="#C97070" font-weight="700">STT</text>

  <text x="150" y="200" text-anchor="middle" font-size="6" fill="#999">Both gracilis + cuneatus present</text>
</svg>

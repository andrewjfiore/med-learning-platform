    <text x="185" y="105" text-anchor="middle" font-size="7" font-weight="700" fill="#7B68AE">CST</text>
  </g>
  
  <!-- Layer: tract_spinocerebellar (SCT) - POSTEROLATERAL -->
  <g id="layer_tract_spinocerebellar">
    <path id="tract_sct_left" d="M 118 90 Q 110 100 112 115 Q 116 118 120 110 Q 122 100 120 90 Z" fill="#6BAF7B" stroke="#5B9F6B" stroke-width="0.8" opacity="0.8"/>
    <path id="tract_sct_right" d="M 182 90 Q 190 100 188 115 Q 184 118 180 110 Q 178 100 180 90 Z" fill="#6BAF7B" stroke="#5B9F6B" stroke-width="0.8" opacity="0.8"/>

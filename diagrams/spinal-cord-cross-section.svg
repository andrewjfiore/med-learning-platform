  <!-- Orientation labels -->
  <text x="150" y="30" text-anchor="middle" font-size="6" fill="#999">POSTERIOR (Dorsal)</text>
  <text x="150" y="195" text-anchor="middle" font-size="6" fill="#999">ANTERIOR (Ventral)</text>

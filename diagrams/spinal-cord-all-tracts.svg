<?xml version="1.0" encoding="UTF-8"?>
<!-- Complete Spinal Cord Cross Section — ALL TRACTS
     14 tracts with anatomically correct positions
     Sources: First Aid 2024, Netter's Atlas, StatPearls -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 0 260 280" width="500" height="540">
  <defs>
    <radialGradient id="abg" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#f5f0e8"/><stop offset="100%" stop-color="#e0d8cc"/>
    </radialGradient>
  </defs>
  
  <text x="150" y="16" text-anchor="middle" font-size="9" font-weight="800" fill="#333">Complete Spinal Cord Cross Section</text>
  <text x="150" y="28" text-anchor="middle" font-size="7" fill="#888">All Major Ascending &amp; Descending Tracts</text>
  
  <!-- Cord outline -->
  <ellipse cx="150" cy="140" rx="62" ry="78" fill="url(#abg)" stroke="#b0a89c" stroke-width="1.5"/>
  
  <!-- Gray matter -->
  <path d="M 150 78 Q 138 90 126 100 Q 114 112 118 130 Q 124 146 112 162 Q 106 174 114 180 Q 132 192 150 192 Q 168 192 186 180 Q 194 174 188 162 Q 176 146 182 130 Q 186 112 174 100 Q 162 90 150 78 Z" fill="#c4beb4" stroke="#a09888" stroke-width="0.8"/>
  
  <!-- Fasciculus proprius (pericentral) -->
  <path d="M 130 105 Q 125 120 128 140 Q 132 155 128 168 Q 135 175 150 178 Q 165 175 172 168 Q 168 155 172 140 Q 175 120 170 105 Q 162 95 150 90 Q 138 95 130 105 Z" fill="#DDD4C4" opacity="0.4" stroke="#C4BAA8" stroke-width="0.5"/>
  <text x="150" y="185" text-anchor="middle" font-size="4.5" fill="#A09888">Fasc. proprius</text>
  
  <!-- Central canal -->
  <circle cx="150" cy="138" r="3" fill="#8aaab4" stroke="#6a8a94" stroke-width="0.5"/>
  
  <!-- === POSTERIOR (SENSORY ASCENDING) === -->
  
  <!-- DCML: Gracilis (medial) + Cuneatus (lateral) -->
  <path id="tract_gracilis" d="M 144 74 Q 150 66 156 74 L 156 108 Q 150 112 144 108 Z" fill="#4A7A8A" opacity="0.85" stroke="#3A6A7A" stroke-width="0.6"/>
  <path id="tract_cuneatus_l" d="M 132 80 L 144 74 L 144 108 L 134 112 Z" fill="#6B9BAA" opacity="0.8" stroke="#5B8B9A" stroke-width="0.6"/>
  <path id="tract_cuneatus_r" d="M 168 80 L 156 74 L 156 108 L 166 112 Z" fill="#6B9BAA" opacity="0.8" stroke="#5B8B9A" stroke-width="0.6"/>
  
  <!-- Lissauer's tract (dorsolateral tips) -->
  <path id="tract_lissauer_l" d="M 116 86 Q 112 92 114 100 Q 118 104 120 96 Q 118 90 116 86 Z" fill="#E8A060" opacity="0.6" stroke="#D08040" stroke-width="0.5"/>
  <path id="tract_lissauer_r" d="M 184 86 Q 188 92 186 100 Q 182 104 180 96 Q 182 90 184 86 Z" fill="#E8A060" opacity="0.6" stroke="#D08040" stroke-width="0.5"/>
  
  <!-- === POSTEROLATERAL === -->
  
  <!-- Dorsal SCT -->
  <path id="tract_dsct_l" d="M 112 96 Q 106 108 108 122 Q 112 126 116 116 Q 116 106 114 96 Z" fill="#6BAF7B" opacity="0.75" stroke="#5B9F6B" stroke-width="0.6"/>
  <path id="tract_dsct_r" d="M 188 96 Q 194 108 192 122 Q 188 126 184 116 Q 184 106 186 96 Z" fill="#6BAF7B" opacity="0.75" stroke="#5B9F6B" stroke-width="0.6"/>
  
  <!-- Cuneocerebellar (adjacent to DSCT, more posterior) -->
  <path id="tract_cct_l" d="M 118 88 Q 114 94 115 100 Q 117 102 119 96 Z" fill="#8FCF9F" opacity="0.6" stroke="#6BAF7B" stroke-width="0.4"/>
  <path id="tract_cct_r" d="M 182 88 Q 186 94 185 100 Q 183 102 181 96 Z" fill="#8FCF9F" opacity="0.6" stroke="#6BAF7B" stroke-width="0.4"/>
  
  <!-- === LATERAL === -->
  
  <!-- Lateral CST (large, lateral funiculus) -->
  <path id="tract_lcst_l" d="M 108 108 Q 100 126 104 148 Q 112 156 116 140 Q 112 124 110 108 Z" fill="#7B68AE" opacity="0.8" stroke="#6B58A0" stroke-width="0.6"/>
  <path id="tract_lcst_r" d="M 192 108 Q 200 126 196 148 Q 188 156 184 140 Q 188 124 190 108 Z" fill="#7B68AE" opacity="0.8" stroke="#6B58A0" stroke-width="0.6"/>
  
  <!-- Rubrospinal (just anterior to LCST) -->
  <path id="tract_rst_l" d="M 104 128 Q 100 136 102 146 Q 106 148 108 140 Q 106 134 104 128 Z" fill="#C97070" opacity="0.5" stroke="#B96060" stroke-width="0.4"/>
  <path id="tract_rst_r" d="M 196 128 Q 200 136 198 146 Q 194 148 192 140 Q 194 134 196 128 Z" fill="#C97070" opacity="0.5" stroke="#B96060" stroke-width="0.4"/>
  
  <!-- Lateral reticulospinal -->
  <path id="tract_lretst_l" d="M 106 148 Q 102 156 104 164 Q 108 166 110 158 Q 108 152 106 148 Z" fill="#D4A870" opacity="0.5" stroke="#B48850" stroke-width="0.4"/>
  <path id="tract_lretst_r" d="M 194 148 Q 198 156 196 164 Q 192 166 190 158 Q 192 152 194 148 Z" fill="#D4A870" opacity="0.5" stroke="#B48850" stroke-width="0.4"/>
  
  <!-- === ANTEROLATERAL === -->
  
  <!-- Spinothalamic tract -->
  <path id="tract_stt_l" d="M 100 140 Q 94 158 100 174 Q 110 182 114 168 Q 108 152 102 140 Z" fill="#C97070" opacity="0.8" stroke="#B96060" stroke-width="0.6"/>
  <path id="tract_stt_r" d="M 200 140 Q 206 158 200 174 Q 190 182 186 168 Q 192 152 198 140 Z" fill="#C97070" opacity="0.8" stroke="#B96060" stroke-width="0.6"/>
  
  <!-- Ventral SCT (anterolateral) -->
  <path id="tract_vsct_l" d="M 104 168 Q 100 176 104 184 Q 110 186 112 178 Q 108 172 104 168 Z" fill="#4BAF6B" opacity="0.6" stroke="#3B9F5B" stroke-width="0.4"/>
  <path id="tract_vsct_r" d="M 196 168 Q 200 176 196 184 Q 190 186 188 178 Q 192 172 196 168 Z" fill="#4BAF6B" opacity="0.6" stroke="#3B9F5B" stroke-width="0.4"/>
  
  <!-- === ANTERIOR === -->
  
  <!-- Anterior CST -->
  <path id="tract_acst_l" d="M 138 178 Q 136 186 138 196 Q 142 198 144 190 Q 142 184 140 178 Z" fill="#9B88CE" opacity="0.6" stroke="#7B68AE" stroke-width="0.4"/>
  <path id="tract_acst_r" d="M 162 178 Q 164 186 162 196 Q 158 198 156 190 Q 158 184 160 178 Z" fill="#9B88CE" opacity="0.6" stroke="#7B68AE" stroke-width="0.4"/>
  
  <!-- Medial reticulospinal -->
  <path id="tract_mretst" d="M 130 186 Q 140 194 150 196 Q 160 194 170 186 L 168 192 Q 160 200 150 202 Q 140 200 132 192 Z" fill="#B4A870" opacity="0.4" stroke="#948850" stroke-width="0.4"/>
  
  <!-- Vestibulospinal -->
  <path id="tract_vest_l" d="M 122 184 Q 118 192 122 200 Q 128 202 130 194 Q 126 188 122 184 Z" fill="#5BAACC" opacity="0.5" stroke="#4B9ABC" stroke-width="0.4"/>
  <path id="tract_vest_r" d="M 178 184 Q 182 192 178 200 Q 172 202 170 194 Q 174 188 178 184 Z" fill="#5BAACC" opacity="0.5" stroke="#4B9ABC" stroke-width="0.4"/>
  
  <!-- Tectospinal -->
  <path id="tract_tect" d="M 144 196 Q 150 202 156 196 L 155 200 Q 150 206 145 200 Z" fill="#CC8888" opacity="0.4" stroke="#AA6666" stroke-width="0.3"/>
  
  <!-- === LABELS === -->
  <!-- Ascending (sensory) -->
  <text x="150" y="64" text-anchor="middle" font-size="6" fill="#5B8A9A" font-weight="700">DCML</text>
  <text x="124" y="78" font-size="4.5" fill="#5B8A9A">Cu</text>
  <text x="150" y="72" text-anchor="middle" font-size="4.5" fill="#4A7A8A">Gr</text>
  <text x="174" y="78" font-size="4.5" fill="#5B8A9A">Cu</text>
  <text x="100" y="90" font-size="4.5" fill="#E8A060" font-weight="600">Lissauer</text>
  <text x="94" y="114" font-size="5" fill="#6BAF7B" font-weight="600">DSCT</text>
  <text x="80" y="160" font-size="5.5" fill="#C97070" font-weight="700">STT</text>
  <text x="90" y="182" font-size="4.5" fill="#4BAF6B" font-weight="600">VSCT</text>
  
  <!-- Descending (motor) -->
  <text x="82" y="130" font-size="5.5" fill="#7B68AE" font-weight="700">LCST</text>
  <text x="82" y="140" font-size="4" fill="#C97070">RST</text>
  <text x="82" y="168" font-size="4" fill="#D4A870">Lat RetST</text>
  <text x="128" y="200" font-size="4" fill="#9B88CE">ACST</text>
  <text x="150" y="214" text-anchor="middle" font-size="4" fill="#B4A870">Med RetST</text>
  <text x="108" y="200" font-size="4" fill="#5BAACC">VeST</text>
  <text x="150" y="220" text-anchor="middle" font-size="3.5" fill="#CC8888">TeST</text>
  
  <!-- Orientation -->
  <text x="150" y="42" text-anchor="middle" font-size="6" fill="#AAA">POSTERIOR (Dorsal)</text>
  <text x="150" y="232" text-anchor="middle" font-size="6" fill="#AAA">ANTERIOR (Ventral)</text>
  
  <!-- Legend -->
  <g transform="translate(10, 240)">
    <text x="0" y="0" font-size="6" font-weight="700" fill="#555">ASCENDING (Sensory):</text>
    <rect x="0" y="5" width="8" height="8" fill="#5B8A9A" rx="1"/><text x="12" y="12" font-size="5" fill="#555">DCML</text>
    <rect x="42" y="5" width="8" height="8" fill="#C97070" rx="1"/><text x="54" y="12" font-size="5" fill="#555">STT</text>
    <rect x="75" y="5" width="8" height="8" fill="#6BAF7B" rx="1"/><text x="87" y="12" font-size="5" fill="#555">DSCT</text>
    <rect x="115" y="5" width="8" height="8" fill="#4BAF6B" rx="1"/><text x="127" y="12" font-size="5" fill="#555">VSCT</text>
    <rect x="155" y="5" width="8" height="8" fill="#8FCF9F" rx="1"/><text x="167" y="12" font-size="5" fill="#555">CCT</text>
    <rect x="190" y="5" width="8" height="8" fill="#E8A060" rx="1"/><text x="202" y="12" font-size="5" fill="#555">Lissauer</text>
    
    <text x="0" y="26" font-size="6" font-weight="700" fill="#555">DESCENDING (Motor):</text>
    <rect x="0" y="31" width="8" height="8" fill="#7B68AE" rx="1"/><text x="12" y="38" font-size="5" fill="#555">LCST</text>
    <rect x="42" y="31" width="8" height="8" fill="#9B88CE" rx="1"/><text x="54" y="38" font-size="5" fill="#555">ACST</text>
    <rect x="84" y="31" width="8" height="8" fill="#C97070" opacity="0.5" rx="1"/><text x="96" y="38" font-size="5" fill="#555">RST</text>
    <rect x="115" y="31" width="8" height="8" fill="#D4A870" rx="1"/><text x="127" y="38" font-size="5" fill="#555">RetST</text>
    <rect x="158" y="31" width="8" height="8" fill="#5BAACC" rx="1"/><text x="170" y="38" font-size="5" fill="#555">VeST</text>
    <rect x="198" y="31" width="8" height="8" fill="#CC8888" rx="1"/><text x="210" y="38" font-size="5" fill="#555">TeST</text>
  </g>
</svg>
